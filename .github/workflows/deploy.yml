name: Validate and publish TinyTorque REAL

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Publier sur Pages (doit être activé dans Settings > Pages)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "tinytorque-real-ci"
  cancel-in-progress: true

jobs:
  validate:
    name: Verify JavaScript and physics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/realism.mjs
          node --check assets/physics.mjs
          node --check assets/guardrails.mjs
          node --check assets/track.mjs
          node --check assets/records.mjs
      - name: Run regression tests
        run: node --test tests/*.test.mjs

  deploy:
    name: Publish GitHub Pages
    needs: validate
    if: ${{ !github.event.repository.private || inputs.deploy_pages == true }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
